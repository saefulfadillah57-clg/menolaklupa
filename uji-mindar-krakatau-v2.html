<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101820">
  <title>Uji MindAR V2 - Krakatau 1883 | MENOLAK LUPA 1888</title>

  <!-- A-Frame dan MindAR versi yang dipasangkan -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101820; color: #fff; font-family: Arial, sans-serif; }
    a-scene { position: fixed; inset: 0; }
    #overlay {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 28px 22px; background: #101820;
    }
    h1 { font-size: clamp(25px, 6vw, 38px); font-weight: 500; margin: 0 0 28px; }
    p { color: #c8d0d8; font-size: 17px; line-height: 1.55; max-width: 620px; margin: 12px 0; }
    button {
      margin-top: 28px; border: 0; border-radius: 16px; padding: 19px 34px;
      background: #28c982; color: #071b13; font-size: 18px; font-weight: 600;
    }
    button:disabled { opacity: .6; }
    #status {
      position: fixed; z-index: 20; left: 14px; right: 14px; bottom: 18px;
      padding: 13px 15px; border-radius: 12px; background: rgba(0,0,0,.78);
      color: #fff; text-align: center; font-size: 14px; line-height: 1.45;
      overflow-wrap: anywhere;
    }
    #debug {
      position: fixed; z-index: 21; top: 8px; left: 8px; right: 8px;
      padding: 7px 9px; border-radius: 8px; background: rgba(0,0,0,.55);
      color: #b9e6d0; font-size: 11px; display: none; overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>MENOLAK LUPA 1888</h1>
    <p>Uji WebAR MindAR – Letusan Gunung Krakatau 1883.</p>
    <p>Arahkan kamera ke gambar target Krakatau yang digunakan saat membuat <b>targets.mind</b>. Setelah gambar dikenali, model 3D akan muncul di atasnya.</p>
    <button id="start" disabled>MENYIAPKAN SISTEM…</button>
  </div>

  <div id="debug"></div>
  <div id="status">Memuat komponen WebAR. Mohon tunggu…</div>

  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ./mindar/targets.mind; autoStart: false;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
    loading-screen="enabled: false"
    style="width:100%;height:100%;">

    <a-assets timeout="30000">
      <a-asset-item id="krakatau-model"
        src="./assets/models/6.Krakatau_1883_LowPoly_Assemblr-compressed.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-gltf-model id="krakatau" src="#krakatau-model"
        position="0 0 0.05" rotation="0 0 0"
        scale="0.15 0.15 0.15">
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    (() => {
      const sceneEl = document.getElementById('ar-scene');
      const startButton = document.getElementById('start');
      const overlay = document.getElementById('overlay');
      const statusBox = document.getElementById('status');
      const debugBox = document.getElementById('debug');
      const targetEl = document.getElementById('target');
      const modelEl = document.getElementById('krakatau');

      let sceneReady = false;
      let starting = false;

      function status(message) {
        statusBox.textContent = message;
      }

      function debug(message) {
        debugBox.style.display = 'block';
        debugBox.textContent = message;
      }

      function describeError(error) {
        if (!error) return 'Kesalahan tidak diketahui.';
        const name = error.name || 'Error';
        const message = error.message || String(error);
        return name + ': ' + message;
      }

      function enableWhenReady() {
        if (sceneReady && sceneEl.systems && sceneEl.systems['mindar-image-system']) {
          startButton.disabled = false;
          startButton.textContent = 'MULAI SCAN AR';
          status('Sistem siap. Tekan MULAI SCAN AR, lalu arahkan kamera ke gambar target.');
          debug('A-Frame siap • MindAR system tersedia');
        }
      }

      sceneEl.addEventListener('loaded', () => {
        sceneReady = true;
        enableWhenReady();
      });

      // Pengaman jika event loaded terjadi sebelum listener siap.
      if (sceneEl.hasLoaded) {
        sceneReady = true;
        enableWhenReady();
      }

      startButton.addEventListener('click', async () => {
        if (starting) return;
        starting = true;
        startButton.disabled = true;
        startButton.textContent = 'MEMBUKA KAMERA…';
        status('Meminta akses kamera dan memulai MindAR…');

        try {
          const arSystem = sceneEl.systems && sceneEl.systems['mindar-image-system'];
          if (!arSystem) {
            throw new Error('Sistem MindAR belum tersedia. Muat ulang halaman dan coba lagi.');
          }
          if (typeof arSystem.start !== 'function') {
            throw new Error('Fungsi start() MindAR tidak ditemukan.');
          }

          await arSystem.start();
          overlay.style.display = 'none';
          status('Kamera aktif. Arahkan kamera ke gambar target Krakatau.');
          debug('Kamera aktif • Menunggu gambar target');
        } catch (error) {
          console.error('MindAR start error:', error);
          const detail = describeError(error);
          status('Gagal memulai WebAR — ' + detail);
          debug('Detail: ' + detail);
          startButton.disabled = false;
          startButton.textContent = 'COBA LAGI';
          starting = false;
        }
      });

      targetEl.addEventListener('targetFound', () => {
        status('TARGET KRAKATAU TERDETEKSI — model 3D ditampilkan.');
      });

      targetEl.addEventListener('targetLost', () => {
        status('Target tidak terlihat. Arahkan kembali kamera ke gambar Krakatau.');
      });

      modelEl.addEventListener('model-loaded', () => {
        debug('Model GLB berhasil dimuat');
      });

      modelEl.addEventListener('model-error', (event) => {
        console.error('Model GLB error:', event);
        status('Gambar target mungkin terdeteksi, tetapi model GLB gagal dimuat. Periksa lokasi file model.');
      });

      window.addEventListener('error', (event) => {
        console.error('JavaScript error:', event.error || event.message);
        debug('JS: ' + (event.message || 'kesalahan JavaScript'));
      });

      window.addEventListener('unhandledrejection', (event) => {
        console.error('Promise error:', event.reason);
        debug('Promise: ' + describeError(event.reason));
      });
    })();
  </script>
</body>
</html>
